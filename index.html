<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- SEO IMPROVEMENT -->
    <title>Free Word Counter Tool - Count Words & Characters Online</title>

    <meta name="description" content="Free online word counter tool. Count words and characters instantly. Fast and easy to use.">
    <meta name="keywords" content="word counter, character counter, text tool, online word count">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 400px;
            max-width: 90%;
        }

        h1 {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            resize: none;
        }

        #result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .buttons {
            margin-top: 15px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }

        .clear-btn {
            background-color: #e74c3c;
        }

        .copy-btn {
            background-color: #3498db;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>

</head>
<body>

    <div class="container">
        <h1>Word Counter Tool</h1>

        <textarea id="text" placeholder="Type or paste your text..." oninput="countWords()"></textarea>

        <p id="result">Words: 0 | Characters: 0</p>

        <div class="buttons">
            <button class="clear-btn" onclick="clearText()">Clear</button>
            <button class="copy-btn" onclick="copyText()">Copy</button>
        </div>
    </div>

    <script>
        function countWords() {
            let input = document.getElementById("text").value;
            let text = input.trim();

            let characters = input.replace(/\s/g, "").length;

            if (text === "") {
                document.getElementById("result").innerText = "Words: 0 | Characters: 0";
                return;
            }

            let words = text.split(/\s+/).length;

            document.getElementById("result").innerText =
                "Words: " + words + " | Characters: " + characters;
        }

        function clearText() {
            document.getElementById("text").value = "";
            countWords();
        }

        function copyText() {
            let textArea = document.getElementById("text");

            navigator.clipboard.writeText(textArea.value)
                .then(() => alert("Text copied!"))
                .catch(() => alert("Copy failed"));
        }
    </script>

</body>
</html>
